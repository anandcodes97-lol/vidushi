<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Departures — Language Translator</title>
<meta name="description" content="Translate text between 130+ languages. A CodeAlpha AI Internship project." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<header class="board-bar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <path d="M12 3a14.5 14.5 0 0 1 3.8 9 14.5 14.5 0 0 1-3.8 9 14.5 14.5 0 0 1-3.8-9A14.5 14.5 0 0 1 12 3z"></path>
    </svg>
    <div class="brand-text">
      <span class="brand-name">Departures</span>
      <span class="brand-tag">Language Translator</span>
    </div>
  </div>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
</header>

<main class="wrap">
  <section class="card" aria-label="Translator">

    <div class="lang-bar">
      <div id="source-dropdown" class="lang-dropdown" data-role="source"></div>

      <button id="swap-btn" class="swap-btn" type="button" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
      </button>

      <div id="target-dropdown" class="lang-dropdown" data-role="target"></div>
    </div>

    <div class="panels">
      <div class="panel">
        <textarea id="input-text" class="text-area" placeholder="Type or paste text to translate…" maxlength="4900"></textarea>
        <div class="panel-footer">
          <span id="char-count" class="mono muted">0 / 4900</span>
          <div class="panel-actions">
            <button id="speak-input-btn" class="icon-btn small" type="button" aria-label="Listen to source text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
            <button id="clear-btn" class="icon-btn small" type="button" aria-label="Clear text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="panel panel-output">
        <textarea id="output-text" class="text-area" placeholder="Translation appears here…" readonly></textarea>
        <div class="panel-footer">
          <span id="status-pill" class="status-pill mono">READY</span>
          <div class="panel-actions">
            <button id="speak-output-btn" class="icon-btn small" type="button" aria-label="Listen to translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
            <button id="copy-btn" class="icon-btn small" type="button" aria-label="Copy translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="error-banner" class="error-banner hidden" role="alert"></div>

    <button id="translate-btn" class="translate-btn" type="button">Translate</button>
  </section>

  <p class="footnote"> Language Translation Tool</p>
</main>

<script>
  // Supplied by Flask: { "english": "en", "french": "fr", ... }
  const LANGUAGES = {{ languages | tojson }};
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
